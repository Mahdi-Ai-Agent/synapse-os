    <circle cx="132" cy="172" r="24" fill="#c084fc"/>
    <circle cx="380" cy="160" r="26" fill="#34d399"/>
    <circle cx="300" cy="392" r="22" fill="#fbbf24"/>
  </g>
  <circle cx="256" cy="268" r="46" fill="#7c9cff"/>
  <circle cx="132" cy="172" r="24" fill="#c084fc"/>
  <circle cx="380" cy="160" r="26" fill="#34d399"/>
