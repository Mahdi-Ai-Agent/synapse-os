  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g stroke-linecap="round" fill="none">
    <path d="M256 268 L132 172" stroke="#c084fc" stroke-opacity="0.55" stroke-width="10"/>
    <path d="M256 268 L380 160" stroke="#34d399" stroke-opacity="0.55" stroke-width="10"/>
    <path d="M256 268 L300 392" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="10"/>
  </g>
  <g filter="url(#glow)" opacity="0.9">
